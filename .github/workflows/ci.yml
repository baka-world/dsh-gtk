name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l . | grep -v '^third_party/' || true)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The tests are unit tests: they never open a window or load GTK, which
      # the runner does not have. resources/runtime is not in the repository,
      # so nothing here needs the bundled dsh.
      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...
