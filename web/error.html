<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DSH Go — server did not start</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafb;
    --fg: #1d1d1d;
    /* The accent of the desktop's GTK 4 theme, which the page bridge
       publishes as --mygo-accent; Adwaita blue where there is none. */
    --accent: var(--mygo-accent, #3584e4);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #222226; --fg: #ffffff; }
  }
  html { height: 100%; }
  body {
    min-height: 100%;
    margin: 0;
    font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  main { max-width: 760px; margin: 0 auto; padding: 40px 24px; }
  h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: -.01em; }
  p.lead { margin: 0 0 22px; opacity: .7; }
  pre {
    margin: 0;
    padding: 14px 16px;
    border-radius: 10px;
    background: rgba(127, 127, 127, .12);
    border: 1px solid rgba(127, 127, 127, .2);
    white-space: pre-wrap;
    word-break: break-word;
    font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    max-height: 46vh;
    overflow: auto;
  }
  .hint { margin: 18px 0 0; opacity: .65; font-size: 13px; }
  .hint code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .row { display: flex; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
  button {
    font: inherit;
    padding: 7px 16px;
    border-radius: 6px;
    border: 0;
    background: rgba(0, 0, 0, .08);
    color: inherit;
    cursor: pointer;
  }
  button:hover { background: rgba(0, 0, 0, .12); }
  button:active { background: rgba(0, 0, 0, .18); }
  @media (prefers-color-scheme: dark) {
    button { background: rgba(255, 255, 255, .1); }
    button:hover { background: rgba(255, 255, 255, .14); }
    button:active { background: rgba(255, 255, 255, .2); }
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.08); }
  .path { font-size: 12px; opacity: .55; margin-top: 16px; word-break: break-all; }
</style>
</head>
<body>
  <main>
    <h1>DeepSeek Harness did not start</h1>
    <p class="lead">The dsh web server stopped before the workspace opened.</p>
    <pre id="error">Reading the error…</pre>
    <p class="hint">
      Run <code>scripts/prepare-runtime.sh</code> to bundle the runtime, or install it with
      <code>npm install -g @deepseek-ai/dsh</code>.
    </p>
    <div class="path" id="log"></div>
    <div class="row">
      <button class="primary" id="retry">Try again</button>
      <button id="logs">Open logs</button>
      <button id="quit">Quit</button>
    </div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const call = (method) => (typeof mygo !== "undefined" ? mygo.call(method) : Promise.reject(new Error("no bridge")));

    call("Launcher.LastError").then((text) => {
      $("error").textContent = text || "Unknown error";
    }).catch(() => {});
    call("Launcher.LogPath").then((path) => {
      if (path) $("log").textContent = "Log: " + path;
    }).catch(() => {});

    $("retry").addEventListener("click", () => { call("Launcher.Retry").catch(() => {}); });
    $("logs").addEventListener("click", () => { call("Launcher.OpenLogs").catch(() => {}); });
    $("quit").addEventListener("click", () => { call("Launcher.Quit").catch(() => {}); });
  </script>
</body>
</html>
